name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & test (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The development toolchain requires Node 20.19+; the CLI targets Node 18.
        os: [ubuntu-latest]
        node: ["20", "22", "24"]
        include:
          - os: macos-latest
            node: "22"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      # The test suite is fully offline (no live AI provider calls), so no API keys are needed.
      - name: Test
        run: npm test

      - name: Real CLI fixture matrix
        run: node scripts/smoke-chaos.mjs

      - name: Package contents and lifecycle
        run: npm pack --dry-run

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

  package-smoke:
    name: Install package (Node 24 and 18)
    needs: build-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run smoke:package
      - run: npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
      - uses: actions/setup-node@v4
        with:
          node-version: "18"
      - name: Run installed CLI on minimum supported Node
        run: node scripts/smoke-package.mjs --tarball "$RUNNER_TEMP/evan-coder-setupr-$(node -p 'require("./package.json").version').tgz"
